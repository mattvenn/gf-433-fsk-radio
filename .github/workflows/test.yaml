name: test
# cocotb on the tx_fine macro and on the TT top level generated from the LVS source (test/Makefile runs both benches),
# on the RTL and on the hardened netlist (GL); docs/verification_digital.md. Tools from YosysHQ's oss-cad-suite (Icarus),
# the gate-level cell models from the same ciel gf180mcuD PDK as the lvs / eqy actions.
on:
  push:
  workflow_dispatch:

env:
  PDK_ROOT: /home/runner/pdk
  PDK: gf180mcuD
  PDK_VERSION: e8daeda73ca8f5814dbc0b11d1d05802251a3750
  OSS_CAD_SUITE: 2026-09-30

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Cache oss-cad-suite
        id: cache-ocs
        uses: actions/cache@v4
        with:
          path: /home/runner/oss-cad-suite
          key: oss-cad-suite-${{ env.OSS_CAD_SUITE }}

      - name: Install oss-cad-suite
        if: steps.cache-ocs.outputs.cache-hit != 'true'
        shell: bash
        run: |
            d=${OSS_CAD_SUITE//-/}
            curl -sfL https://github.com/YosysHQ/oss-cad-suite-build/releases/download/$OSS_CAD_SUITE/oss-cad-suite-linux-x64-$d.tgz \
              | tar xz -C /home/runner

      - name: Install gf180mcuD PDK
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: ${{ env.PDK }}
          pdk_version: ${{ env.PDK_VERSION }}
          pdk_root: ${{ env.PDK_ROOT }}

      - name: Python packages
        run: pip3 install --break-system-packages -r test/requirements.txt pyyaml

      - name: Pinout check
        run: python3 tools/check_pinout.py

      - name: cocotb, RTL and GL
        shell: bash
        run: |
            export PATH=$PATH:/home/runner/oss-cad-suite/bin
            iverilog -V | head -1
            cd test
            make
            make GL=1
            for f in results_*.xml; do
              n=$(grep -c "<testcase" $f); bad=$(grep -c "<failure" $f || true)
              echo "$f: $n tests, $bad failed" | tee -a $GITHUB_STEP_SUMMARY
              [ "$bad" = 0 ] && [ "$n" -gt 0 ] || exit 1
            done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test/results_*.xml
            test/sim_build_*/*.fst
