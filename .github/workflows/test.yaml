name: test
# cocotb on the tx_fine macro and on the TT top level generated from the LVS source (test/Makefile runs both benches),
# on the RTL and on the hardened netlist (GL); docs/verification_digital.md. Icarus from Ubuntu (oss-cad-suite's vvp
# wrapper brings its own Python, which cocotb's embedded interpreter can't start under); the gate-level cell models
# from the same ciel gf180mcuD PDK as the lvs / eqy actions.
on:
  push:
  workflow_dispatch:

env:
  PDK_ROOT: /home/runner/pdk
  PDK: gf180mcuD
  PDK_VERSION: e8daeda73ca8f5814dbc0b11d1d05802251a3750

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iverilog

      - name: Install gf180mcuD PDK
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: ${{ env.PDK }}
          pdk_version: ${{ env.PDK_VERSION }}
          pdk_root: ${{ env.PDK_ROOT }}

      - name: Python packages
        run: pip3 install --break-system-packages -r test/requirements.txt pyyaml

      - name: Pinout check
        run: python3 tools/check_pinout.py

      - name: cocotb, RTL and GL
        shell: bash
        run: |
            iverilog -V | head -1
            cd test
            make
            make GL=1
            for f in results_*.xml; do
              n=$(grep -c "<testcase" $f); bad=$(grep -c "<failure" $f || true)
              echo "$f: $n tests, $bad failed" | tee -a $GITHUB_STEP_SUMMARY
              [ "$bad" = 0 ] && [ "$n" -gt 0 ] || exit 1
            done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test/results_*.xml
            test/sim_build_*/*.fst
