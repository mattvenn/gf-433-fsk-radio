name: docs

on:
  push:
    branches-ignore: [verify-gaps]     # the full verification run's branch: no Actions (Matt 2026-11-25)
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@ttgf26c
